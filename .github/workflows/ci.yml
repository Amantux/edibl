name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # Cancel superseded runs on the same PR; never cancel a push to the default
  # branch (protects the version bump + image build/publish from interruption).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install & test
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q

  config:
    name: Configuration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Settings + precedence tests
        working-directory: backend
        run: pytest tests/test_config_contract.py -q
      - name: Generated config docs are in sync with the code
        run: python3 tools/gen_config_docs.py --check
      - name: Every setting is documented, and every setting used is declared
        # Bidirectional: a field missing from the docs AND a EDIBL_* read in code
        # that nobody declared are both failures. This is what stops the registry
        # from quietly drifting back into scattered os.environ.get calls.
        run: |
          python3 - <<'CONTRACT'
          import os, re, sys
          sys.path.insert(0, "backend")
          from app.settings import FIELDS

          declared = {f.env_var for f in FIELDS}
          problems = []

          for doc in (".env.example", "docs/configuration.md"):
              text = open(doc).read()
              problems += [f"{v} is not documented in {doc}"
                           for v in sorted(declared) if v not in text]

          used = set()
          roots = ["backend/app", "backend/edibl_mcp.py", "backend/run.py"]
          for root in roots:
              paths = [root] if os.path.isfile(root) else [
                  os.path.join(d, f) for d, _, fs in os.walk(root)
                  for f in fs if f.endswith(".py")]
              for path in paths:
                  for m in re.findall(r"EDIBL_[A-Z0-9_]+", open(path).read()):
                      used.add(m[:-5] if m.endswith("_FILE") else m)

          problems += [f"{v} is used in code but not declared in FIELDS"
                       for v in sorted(used - declared)]

          if problems:
              print("Configuration contract violations:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Configuration contract OK: {len(declared)} declared, "
                f"{len(used)} referenced, all documented.")
          CONTRACT
      - name: Invalid configuration is actually rejected
        # Mutation-style: if config_check stopped validating, these would pass
        # silently and the gate in docker-entrypoint.sh would be decorative.
        working-directory: backend
        run: |
          set -e
          fail() { echo "EXPECTED REJECTION: $1"; exit 1; }
          EDIBL_DISABLE_AUTH=maybe python3 -m app.config_check --ha-options /nonexistent \
            && fail "EDIBL_DISABLE_AUTH=maybe" || true
          EDIBL_PORT=99999 python3 -m app.config_check --ha-options /nonexistent \
            && fail "EDIBL_PORT out of range" || true
          EDIBL_CORS_ORIGINS='*' python3 -m app.config_check --ha-options /nonexistent \
            && fail "wildcard CORS origin" || true
          EDIBL_SECRET_KEY=change-me-in-production python3 -m app.config_check --ha-options /nonexistent \
            && fail "placeholder secret with auth enabled" || true
          python3 -m app.config_check --ha-options /nonexistent > /dev/null \
            || fail "a VALID configuration was rejected"
          echo "All invalid configurations were rejected; the valid one was accepted."

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Ruff
        run: pip install "ruff==0.15.12" && ruff check backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        working-directory: frontend
        run: npm ci && npm run lint

  integration-tests:
    name: HA integration (config flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs the config-flow tests in a real Home Assistant env (py3.13). Gating —
    # confirmed green against the pinned HA.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/edibl/tests/requirements_test.txt
      - name: Run integration tests
        # asyncio_mode=auto: the async test fns have no per-test marker. sys.path
        # is fixed in the tests' conftest so `custom_components.edibl` imports.
        run: pytest custom_components/edibl/tests -q -o asyncio_mode=auto

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

  e2e:
    name: E2E (browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install backend + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run e2e journeys
        run: pytest e2e -q

  smoke:
    name: Container smoke (build → readiness → shutdown)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: edibl:ci
      - name: Run + wait for readiness + smoke + clean shutdown
        run: |
          set -euo pipefail
          docker run -d --name edibl-ci -p 7746:7746 \
            -e EDIBL_SECRET_KEY="$(openssl rand -base64 48)" edibl:ci
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7746/api/v1/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs edibl-ci; exit 1; fi
          curl -fsS http://127.0.0.1:7746/api/v1/ready
          # Every SERVER process must be non-root (uid 1000). pid 1 is now the
          # supervising shell, which stays root on purpose so it can chown the
          # Supervisor-managed /data and forward signals — so assert on the
          # children (gunicorn, edibl_mcp), not on pid 1.
          # Gate on /proc/*/comm, not the cmdline: a cmdline match would also
          # match this very scanning shell (its own command text contains the
          # pattern) and report a spurious root process.
          servers=$(docker exec edibl-ci sh -c 'for d in /proc/[0-9]*; do
              comm=$(cat $d/comm 2>/dev/null)
              case "$comm" in
                gunicorn) ;;
                python3) tr "\0" " " < $d/cmdline 2>/dev/null | grep -q edibl_mcp || continue ;;
                *) continue ;;
              esac
              awk "/^Uid:/{print \$2}" $d/status 2>/dev/null
            done' | sort -u)
          echo "server uids: $servers"
          test -n "$servers"           # something must be running
          test "$servers" = "1000"     # sort -u collapses to exactly one value
          docker stop -t 15 edibl-ci
          # gunicorn exits 0 on a graceful SIGTERM; 137 = SIGKILL after the grace
          # period (ignored SIGTERM). Fail the gate on a non-graceful shutdown.
          test "$(docker inspect -f '{{.State.ExitCode}}' edibl-ci)" = "0"
      - name: Logs on failure
        if: failure()
        run: docker logs edibl-ci || true
