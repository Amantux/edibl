name: Security scan

# Advisory quality/security gates. Kept separate from CI so an upstream CVE or a
# scanner hiccup never blocks the release pipeline; results surface in the repo's
# Security tab (SARIF) and as job status on PRs.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "27 6 * * 1"   # weekly, Monday 06:00 UTC — catch newly-disclosed CVEs
  workflow_dispatch:

# Least privilege. `security-events: write` is required to upload SARIF (CodeQL
# and Trivy); `actions: read` lets CodeQL read workflow metadata.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          language: ${{ matrix.language }}
          # Query suite + path exclusions live in the config file, with the
          # reasoning for each narrowing recorded alongside them.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

  python-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: npm audit
        continue-on-error: true
        run: |
          npm --prefix frontend install --package-lock-only --no-audit --no-fund
          npm --prefix frontend audit --audit-level=high

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        continue-on-error: true
        # Reads .gitleaks.toml from the repo root: default rules + an allowlist
        # for backend test fixtures (throwaway keys), documented in that file.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master @ 2026-07-02
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  # Ported from myMeal/HomeHoard, which already run both. Divergent security
  # config across sibling repos is exactly how one of them ends up with a gap
  # nobody notices — this repo was the odd one out.
  dependency-review:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    # The deliberate exception to "scanning is advisory": this gates dependencies
    # a PR is trying to ADD, which is cheap to act on before it lands.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.8.2
        with:
          fail-on-severity: high

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisory: this job PRODUCES an artifact, it cannot report a finding.
      # It failed once because syft's release download returned a 302 — a
      # third-party CDN hiccup must not turn the Security tab red.
      - continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.20.9
        with:
          path: .
          format: spdx-json
          artifact-name: edibl-sbom.spdx.json
